services:
  - type: web
    name: frontier-run-gemini-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python ai_server.py
    healthCheckPath: /health
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: RATE_LIMIT_REQUESTS
        value: "20"
      - key: RATE_LIMIT_WINDOW_SECONDS
        value: "60"
